version: "3.9"

# ============================================================
# Cybersecurity Threat Detection - Lambda Architecture Stack
# Services: Hadoop (3 nodes) + HBase + Zookeeper + Kafka + Cassandra
#           + InfluxDB + Grafana
# All services use static IPs on the 172.20.0.0/24 network.
# ============================================================

services:

  # ─── HADOOP NAMENODE ──────────────────────────────────────
  hadoop-master:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-master
    hostname: hadoop-master
    tty: true
    stdin_open: true
    ports:
      - "9870:9870"   # HDFS Web UI
      - "9000:9000"   # HDFS NameNode
      - "8088:8088"   # YARN ResourceManager UI
    environment:
      - CLUSTER_NAME=cybersecurity-cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-master:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./scripts:/scripts
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.2

  # ─── HADOOP DATANODE 1 ────────────────────────────────────
  hadoop-worker1:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-worker1
    hostname: hadoop-worker1
    tty: true
    stdin_open: true
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-master:9000
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    depends_on:
      - hadoop-master
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.3

  # ─── HADOOP DATANODE 2 ────────────────────────────────────
  hadoop-worker2:
    image: liliasfaxi/hadoop-cluster:latest
    container_name: hadoop-worker2
    hostname: hadoop-worker2
    tty: true
    stdin_open: true
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-master:9000
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    depends_on:
      - hadoop-master
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.4

  # ─── HBASE MASTER ─────────────────────────────────────────
  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    hostname: hbase
    ports:
      - "16000:16000"   # HBase Master
      - "16010:16010"   # HBase Web UI
      - "16020:16020"   # HBase RegionServer
      - "16030:16030"   # RegionServer Web UI
      - "2183:2181"     # HBase-internal ZooKeeper (avoid collision with Kafka ZK)
    environment:
      HBASE_DOCKER_HOSTNAME: hbase
    volumes:
      - hbase_data:/data/hbase
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.8

  # ─── ZOOKEEPER (For Kafka) ────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.9

  # ─── KAFKA ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"     # Host access
      - "29092:29092"   # Internal access (Spark)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.20.0.10:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.10

  # ─── CASSANDRA (NoSQL for streaming results) ──────────────
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: sitcn-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_LISTEN_ADDRESS: 172.20.0.20
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: 172.20.0.20
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.20

  # ─── INFLUXDB (Time‑series database) ──────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    hostname: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=cyber-org
      - DOCKER_INFLUXDB_INIT_BUCKET=cyber-bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=super-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.30

  # ─── GRAFANA (Visualisation) ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      cybernetwork:
        ipv4_address: 172.20.0.31

# ============================================================
# VOLUMES
# ============================================================
volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hbase_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  cassandra_data:
  influxdb_data:
  grafana_data:

# ============================================================
# NETWORK — fixed subnet for static IPs
# ============================================================
networks:
  cybernetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
